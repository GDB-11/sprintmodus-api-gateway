spring.application.name=api-gateway

server.port=8090
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Register by IP: the machine hostname is not resolvable by the gateway's Netty DNS resolver
eureka.instance.prefer-ip-address=true

# --- Routes (Spring Cloud Gateway Server WebFlux) -------------------------------------------
# Services are resolved through Eureka (lb://<spring.application.name>).
# Paths are forwarded unchanged: each service owns its own URL space.

# auth-service
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

# project-service
spring.cloud.gateway.server.webflux.routes[1].id=project-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://project-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/projects/**,/api/sprints/**

# workitem-service (REST)
spring.cloud.gateway.server.webflux.routes[2].id=workitem-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://workitem-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/work-items/**,/api/status-workflows/**,/api/admin/status-workflows/**

# workitem-service (WebSocket / STOMP board): /ws/tenant/{tenantId}/project/{projectId}/board
spring.cloud.gateway.server.webflux.routes[3].id=workitem-service-ws
spring.cloud.gateway.server.webflux.routes[3].uri=lb:ws://workitem-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/ws/**

# --- CORS -----------------------------------------------------------------------------------
# The gateway is the only CORS authority; downstream services must not add their own CORS headers.
# Override CORS_ALLOWED_ORIGINS in other environments (comma-separated).
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type,Accept
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].max-age=3600
